# An alacritty.toml, as `motty import alacritty` reads it.
[general]
working_directory = "/tmp"

[env]
TERM = "xterm-256color"
EDITOR = "hx"

[font]
size = 12.5

[font.normal]
family = "Hack"

[scrolling]
history = 20000

[cursor.style]
shape = "Underline"
blinking = "Always"

[colors.primary]
foreground = "#c5c8c6"
background = "0x1d1f21"

[colors.normal]
red = "#cc6666"

[colors.bright]
red = "#d54e53"

[selection]
save_to_clipboard = true

[mouse]
hide_when_typing = true

[window]
option_as_alt = "OnlyLeft"
dynamic_title = false
opacity = 0.9

[window.padding]
x = 6

[terminal.shell]
program = "/bin/zsh"
args = ["-l"]

[[keyboard.bindings]]
key = "T"
mods = "Command"
action = "CreateNewTab"

[[keyboard.bindings]]
key = "Equals"
mods = "Command|Shift"
action = "IncreaseFontSize"

[[keyboard.bindings]]
key = "Key3"
mods = "Command"
action = "SelectTab3"

[[keyboard.bindings]]
key = "Left"
mods = "Option"
chars = "\u001bb"

[[keyboard.bindings]]
key = "K"
mods = "Command"
mode = "Vi"
action = "ScrollToTop"
