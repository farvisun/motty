# A Ghostty config, as `motty import ghostty` reads it.
font-family = "JetBrains Mono"
font-family = Symbols Nerd Font Mono
font-size = 14
font-feature = -calt
command = /opt/homebrew/bin/fish
env = EDITOR=nvim
working-directory = home
window-inherit-working-directory = false
scrollback-limit = 10000000

theme = light:Nord,dark:Dracula
background = 1e1e2e
foreground = #cdd6f4
palette = 1=#f38ba8
background-opacity = 0.9

cursor-style = bar
cursor-style-blink = true
macos-option-as-alt = left
copy-on-select = clipboard
clipboard-read = allow
unfocused-split-opacity = 0.8
shell-integration = none
window-save-state = never
window-new-tab-position = current
confirm-close-surface = always
window-padding-x = 4

keybind = super+t=new_tab
keybind = cmd+d=new_split:right
keybind = ctrl+shift+one=goto_tab:1
keybind = cmd+k=text:\x0c
keybind = cmd+shift+p=jump_to_prompt:-1
keybind = cmd+shift+n=jump_to_prompt:1
keybind = global:cmd+grave=toggle_quick_terminal
keybind = cmd+shift+w=write_scrollback_file
