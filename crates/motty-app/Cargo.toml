[package]
name = "motty-app"
version.workspace = true
edition.workspace = true
license.workspace = true

# Not `Motty`: on a case-insensitive disk it would collide with the `motty`
# CLI in target/. Bundles name it Motty.
[[bin]]
name = "motty-app"
path = "src/main.rs"

[dependencies]
gpui.workspace = true
gpui_platform = { workspace = true, features = ["font-kit"] }
anyhow.workspace = true
libc = "0.2"
async-channel = "2"
dirs.workspace = true
motty-ipc.workspace = true
motty-render.workspace = true
serde.workspace = true
serde_json = { version = "1", features = ["preserve_order"] }
motty-term.workspace = true
motty-theme.workspace = true
toml.workspace = true
unicode-segmentation = "1.12"
unicode-width = "0.2"
tracing.workspace = true
tracing-subscriber.workspace = true
raw-window-handle = "0.6"
ignore = "0.4"
grep-searcher = "0.1"
grep-regex = "0.1"
grep-matcher = "0.1"
sha2 = "0.10"
# Pure-Rust regex engine; the grammars come from two-face (bat's set, a
# superset of syntect's defaults), so syntect's own dump isn't linked.
syntect = { version = "5.3", default-features = false, features = ["parsing", "dump-load", "regex-fancy"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"] }
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSView", "NSVisualEffectView", "NSGlassEffectView", "NSResponder", "NSColor", "NSGraphics", "NSAppearance", "NSWindow", "NSButton", "NSControl", "NSMenu", "NSMenuItem", "NSImage", "NSEvent", "NSCell", "NSApplication", "NSRunningApplication", "NSSegmentedControl", "NSTextField", "NSFont", "NSTextAttachment", "NSAttributedString", "NSPasteboard", "NSParagraphStyle", "NSText", "NSStringDrawing", "NSWorkspace", "NSSharingService", "NSBitmapImageRep", "NSImageRep", "NSGraphicsContext"] }
objc2-foundation = { version = "0.3", features = ["NSGeometry", "NSBundle", "NSString", "NSError", "NSArray", "NSAttributedString", "NSRange", "NSDictionary", "NSURL", "NSURLRequest", "NSKeyValueCoding", "NSValue", "NSData", "NSFileManager"] }
objc2-user-notifications = { version = "0.3", features = ["UNUserNotificationCenter", "UNNotificationRequest", "UNNotificationContent", "UNNotificationTrigger", "UNNotification", "block2"] }
block2 = "0.6"
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "objc2-app-kit", "objc2-core-foundation", "block2", "WKWebView", "WKWebViewConfiguration", "WKWebsiteDataStore", "WKWebpagePreferences", "WKNavigation", "WKNavigationAction", "WKUIDelegate", "WKWindowFeatures", "WKFindConfiguration", "WKFindResult", "WKScriptMessage", "WKScriptMessageHandler", "WKUserContentController"] }
objc2-quick-look-ui = { version = "0.3", default-features = false, features = ["std", "objc2-app-kit", "QLPreviewView", "QLPreviewItem"] }

[features]
default = ["runtime-shaders"]
# Compiles Metal shaders at launch so builds don't need Xcode's Metal toolchain.
# Release builds disable it (`--no-default-features`) to precompile.
runtime-shaders = ["gpui_platform/runtime_shaders"]
