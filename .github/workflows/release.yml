name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  dmg:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: scripts/package-dmg.sh
      # The in-app updater checks Motty.dmg against this (and GitHub's asset digest).
      - run: cd dist && shasum -a 256 Motty.dmg Motty-*-universal.dmg > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > dist/notes.md
          cat >> dist/notes.md <<'EOF'

          ### Install

          Download **Motty.dmg**, open it and drag Motty to Applications. The build is not notarized yet: the first time, right-click Motty and choose **Open**, or run `xattr -dr com.apple.quarantine /Applications/Motty.app`.
          EOF
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          body_path: dist/notes.md
          files: |
            dist/Motty.dmg
            dist/Motty-*-universal.dmg
            dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: Motty-dmg
          path: dist/*.dmg
