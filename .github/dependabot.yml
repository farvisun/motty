# Weekly dependency updates; minor and patch bumps come grouped in one pull request.
version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cargo-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Pinned on purpose: gpui-pre moves in lockstep with the app, and
      # alacritty_terminal is vendored with Motty's patches.
      - dependency-name: gpui-pre
      - dependency-name: gpui-pre-platform
      - dependency-name: alacritty_terminal

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github_actions-minor-and-patch:
        update-types: [minor, patch]
